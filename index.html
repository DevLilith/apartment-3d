<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>const S = 1/32; // 1 ft = 32 plan px

        g.beginPath(); g.moveTo(seg[0],gy); g.bezierCurveTo(seg[0]+(seg[1]-seg[0])*.3,gy+rnd(-4,4),seg[0]+(seg[1]-seg[0])*.7,gy+rnd(-4,4),seg[1],gy+rnd(-2,2)); g.stroke(); }
      g.fillStyle='rgba(60,40,20,.55)'; g.fillRect(seg[0],y,1.5,ph); }

});

    const gr=g.createLinearGradient(i*256,j*256,i*256+256,j*256+256); gr.addColorStop(0,'rgba(255,255,255,.35)'); gr.addColorStop(1,'rgba(0,0,0,.05)'); g.fillStyle=gr; g.fillRect(i*256+4,j*256+4,248,248);} });

function box(x1,y1,x2,y2,h,m,y0=0,grp=furn){
  const o=new THREE.Mesh(new THREE.BoxGeometry((x2-x1)*S,h,(y2-y1)*S),m);

  sh.lineTo(-hw+r,hd); sh.quadraticCurveTo(-hw,hd,-hw,hd-r); sh.lineTo(-hw,-hd+r); sh.quadraticCurveTo(-hw,-hd,-hw+r,-hd);
  const g=new THREE.ExtrudeGeometry(sh,{depth:Math.max(.01,h-2*b),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:3,curveSegments:5});
  g.rotateX(-Math.PI/2); const o=new THREE.Mesh(g,m); o.position.set((x1+x2)/2*S,y0+b,(y1+y2)/2*S); o.castShadow=o.receiveShadow=true; grp.add(o); return o; }
function floorTile(x1,y1,x2,y2,tex,ftPerTile,o={},y0=0,h=.04){
